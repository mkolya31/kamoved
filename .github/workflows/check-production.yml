name: Check Kamoved production candidate

on:
  pull_request_target:
    branches:
      - production
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - edited

permissions:
  contents: read
  statuses: write

concurrency:
  group: kamoved-production-preflight-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  production-readiness:
    name: Check candidate on production VPS
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Mark check as pending
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          gh api \
            --method POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state=pending \
            -f context='Production readiness' \
            -f description='Проверка кандидата на production-сервере'

      - name: Validate source branch
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -eu

          if [ "$HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" ]; then
            echo 'В production разрешены merge только из веток этого репозитория.' >&2
            exit 1
          fi

          case "$HEAD_REF" in
            develop|hotfix/*)
              ;;
            *)
              echo 'В production разрешены merge только из develop и hotfix/*.' >&2
              exit 1
              ;;
          esac

      - name: Configure SSH
        env:
          VPS_CI_SSH_KEY: ${{ secrets.VPS_CI_SSH_KEY }}
        run: |
          set -eu
          : "${VPS_CI_SSH_KEY:?Missing VPS_CI_SSH_KEY secret}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_CI_SSH_KEY" > ~/.ssh/preflight_key
          chmod 600 ~/.ssh/preflight_key
          printf '%s\n' \
            '72.56.12.35 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPIBlDKLaRdvcFMv0J5PYABYM4E4wIJw4uEPdEliAceM' \
            > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Check production candidate
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -i ~/.ssh/preflight_key \
            -p 22 \
            laptop@72.56.12.35 \
            "preflight ${PR_NUMBER} ${BASE_SHA} ${HEAD_SHA}"

      - name: Publish check result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -eu

          if [ "$JOB_STATUS" = success ]; then
            state=success
            description='Кандидат готов к merge в production'
          else
            state=failure
            description='Кандидат не прошёл production-проверку'
          fi

          gh api \
            --method POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state="$state" \
            -f context='Production readiness' \
            -f description="$description" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
