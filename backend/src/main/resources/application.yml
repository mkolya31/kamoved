spring:
  application:
    name: kamoved
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/kamoved}
    username: ${DB_USERNAME:kamoved}
    password: ${DB_PASSWORD:kamoved}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 7d
      cookie:
        max-age: 7d
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax

kamoved:
  bootstrap-admin:
    username: ${KAMOVED_ADMIN_USERNAME:admin}
    password: ${KAMOVED_ADMIN_PASSWORD:change-me-local}
    display-name: ${KAMOVED_ADMIN_DISPLAY_NAME:Администратор}
