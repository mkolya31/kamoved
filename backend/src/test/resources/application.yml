spring:
  datasource:
    url: jdbc:h2:mem:kamoved;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  session:
    timeout: 7d
    jdbc:
      cleanup-cron: "0 * * * * *"
      initialize-schema: never

server:
  servlet:
    session:
      timeout: 7d
      cookie:
        name: JSESSIONID
        max-age: 7d
        http-only: true
        secure: true
        same-site: lax

kamoved:
  users:
    - username: admin
      password: test-password
      display-name: Тестовый пользователь
    - username: maksim
      password: maxim-test-password
      display-name: Максим
