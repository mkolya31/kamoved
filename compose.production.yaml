name: kamoved

services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.production}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - database-network

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      DB_URL: jdbc:postgresql://database:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env.production}
      DB_USERNAME: ${POSTGRES_USER:?Set POSTGRES_USER in .env.production}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
      SESSION_COOKIE_SECURE: "true"
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx512m"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - backend-network
      - database-network

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      backend-network:
      web:
        aliases:
          - kamoved-frontend

networks:
  backend-network:
    internal: true
  database-network:
    internal: true
  web:
    external: true
    name: web

volumes:
  postgres-data:
