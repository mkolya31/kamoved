name: kamoved-preflight

services:
  database:
    image: postgres:17-alpine
    restart: "no"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.production}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  backend:
    image: ${KAMOVED_PREFLIGHT_BACKEND_IMAGE:?Set KAMOVED_PREFLIGHT_BACKEND_IMAGE}
    restart: "no"
    env_file:
      - ${KAMOVED_PREFLIGHT_ENV_FILE:?Set KAMOVED_PREFLIGHT_ENV_FILE}
    environment:
      DB_URL: jdbc:postgresql://database:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env.production}
      DB_USERNAME: ${POSTGRES_USER:?Set POSTGRES_USER in .env.production}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
      KAMOVED_MAIL_ENABLED: "false"
      KAMOVED_MAIL_HOST: 127.0.0.1
      KAMOVED_MAIL_PORT: "1"
      KAMOVED_MAIL_PASSWORD: ""
      SESSION_COOKIE_SECURE: "true"
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx512m
    depends_on:
      database:
        condition: service_healthy

  frontend:
    image: ${KAMOVED_PREFLIGHT_FRONTEND_IMAGE:?Set KAMOVED_PREFLIGHT_FRONTEND_IMAGE}
    restart: "no"
    depends_on:
      - backend

networks:
  default:
    internal: true

volumes:
  postgres-data:
